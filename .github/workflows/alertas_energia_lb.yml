name: Alertas energéticas contra línea base

# Espera a que termine exitosamente el precálculo del historial persistente.
# También permite una ejecución manual de prueba sin envío.
on:
  workflow_run:
    workflows: ["Precalcular historial de Datos Operacionales"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      enviar:
        description: "Enviar correo real (false = solo vista previa)"
        required: true
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: efe-alertas-lb-main
  cancel-in-progress: false

jobs:
  revisar:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Cargar repositorio y base publicada
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Instalar dependencias de datos
        run: python -m pip install "pandas>=2.0" "numpy>=1.24" "pyarrow>=14.0"

      - name: Evaluar anomalías energéticas y enviar si corresponde
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_FROM: ${{ secrets.SMTP_FROM }}
          SMTP_SSL: ${{ vars.SMTP_SSL }}
          LB_ALERT_UMBRAL_PCT: ${{ vars.LB_ALERT_UMBRAL_PCT }}
          LB_ALERT_UMBRAL_KWH: ${{ vars.LB_ALERT_UMBRAL_KWH }}
          LB_ALERT_DIAS_REVISAR: ${{ vars.LB_ALERT_DIAS_REVISAR }}
          LB_ALERT_DESTINATARIOS: ${{ vars.LB_ALERT_DESTINATARIOS }}
          MANUAL_ENVIAR: ${{ inputs.enviar }}
          EVENTO: ${{ github.event_name }}
        shell: bash
        run: |
          # Las variables opcionales vacías no deben anular los valores por defecto.
          : "${LB_ALERT_UMBRAL_PCT:=0}"
          : "${LB_ALERT_UMBRAL_KWH:=0}"
          : "${LB_ALERT_DIAS_REVISAR:=30}"
          export LB_ALERT_UMBRAL_PCT LB_ALERT_UMBRAL_KWH LB_ALERT_DIAS_REVISAR
          if [[ "$EVENTO" == "workflow_dispatch" && "$MANUAL_ENVIAR" != "true" ]]; then
            python alertas_energia_lb.py --vista-previa
          else
            python alertas_energia_lb.py --enviar
          fi

      - name: Persistir registro de correos enviados
        if: ${{ success() }}
        shell: bash
        run: |
          if [[ -f data/_alertas_lb/enviadas.json ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/_alertas_lb/enviadas.json
            if ! git diff --cached --quiet; then
              git commit -m "Registrar alertas de línea base enviadas [skip ci]"
              git pull --rebase origin main
              git push origin HEAD:main
            fi
          fi
